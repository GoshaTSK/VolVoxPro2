<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>VolVoxPro — рабочее пространство проекта</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2d; --bg3:#1e2638; --border:#2a3446;
    --text:#e6ecf5; --muted:#8a97ad; --accent:#4f8cff; --accent2:#22c55e;
    --danger:#ef4444; --warn:#f59e0b; --purple:#a855f7; --overlay:rgba(5,8,14,.72);
  }
  html[data-theme="light"]{
    --bg:#f6f8fc; --bg2:#ffffff; --bg3:#eef2f8; --border:#d9e0ec;
    --text:#0f1a2c; --muted:#65728a; --accent:#2b6cf6; --accent2:#16a34a;
    --danger:#dc2626; --warn:#d97706; --purple:#8b5cf6; --overlay:rgba(15,26,44,.42);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden; -webkit-font-smoothing:antialiased}
  .app{display:grid; grid-template-columns:270px 1fr; height:100vh}

  .sidebar{background:var(--bg2); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow-y:auto}
  .logo{padding:18px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px}
  .logo-mark{width:36px; height:36px; border-radius:10px;
    background:linear-gradient(135deg,#4f8cff,#a855f7); display:grid; place-items:center;
    font-weight:700; font-size:18px; color:#fff}
  .logo-text b{display:block; font-size:16px; letter-spacing:.3px}
  .logo-text span{font-size:11px; color:var(--muted)}
  .nav{padding:14px 10px; flex:1}
  .nav-title{font-size:11px; text-transform:uppercase; letter-spacing:.8px;
    color:var(--muted); padding:12px 10px 6px; font-weight:600}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px;
    border-radius:9px; cursor:pointer; font-size:14px; transition:.15s; user-select:none; margin-bottom:2px}
  .nav-item:hover{background:var(--bg3)}
  .nav-item.active{background:var(--accent); color:#fff}
  .nav-item .ic{width:20px; text-align:center; font-size:15px}
  .sidebar-footer{padding:12px 16px; border-top:1px solid var(--border);
    font-size:11px; color:var(--muted); line-height:1.6; display:flex; flex-direction:column; gap:8px}
  .sidebar-actions{display:flex; gap:6px; flex-wrap:wrap}
  .chipbtn{padding:4px 9px; border-radius:20px; background:var(--bg3); border:1px solid var(--border);
    cursor:pointer; font-size:11px; color:var(--text)}
  .chipbtn:hover{border-color:var(--accent)}

  .main{overflow-y:auto; padding:24px 32px 80px}
  .page-title{font-size:24px; margin-bottom:6px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .page-sub{color:var(--muted); font-size:13px; margin-bottom:20px}

  .btn{display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:9px;
    border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer;
    font-size:13px; font-weight:500; transition:.15s}
  .btn:hover{background:#26314a; border-color:#3a465e}
  html[data-theme="light"] .btn:hover{background:#e4ebf7}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{background:#3d7cf0}
  .btn.success{background:var(--accent2); border-color:var(--accent2); color:#fff}
  .btn.danger{background:transparent; border-color:#4b2a2a; color:#ff9a9a}
  .btn.danger:hover{background:#2a1616}
  html[data-theme="light"] .btn.danger{color:var(--danger); border-color:#f3c4c4}
  html[data-theme="light"] .btn.danger:hover{background:#fde8e8}
  .btn.sm{padding:5px 10px; font-size:12px}
  .btn.ghost{background:transparent}
  .btn.big{padding:14px 22px; font-size:14px}

  input,textarea,select{width:100%; padding:10px 12px; border-radius:9px;
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    font-family:inherit; font-size:13px; outline:none; transition:.15s}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical; min-height:70px; line-height:1.5}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:500}
  .field{margin-bottom:14px}
  .row{display:grid; gap:14px}
  .row.c2{grid-template-columns:1fr 1fr}
  .row.c3{grid-template-columns:1fr 1fr 1fr}
  .row.c4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--bg2); border:1px solid var(--border);
    border-radius:13px; padding:18px 20px; margin-bottom:16px}
  .card h3{font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:8px; justify-content:space-between}
  .muted{color:var(--muted)}
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; flex-wrap:wrap}
  .tab{padding:9px 14px; cursor:pointer; font-size:13px; color:var(--muted);
    border-bottom:2px solid transparent; margin-bottom:-1px; transition:.15s; white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}
  .pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px;
    background:var(--bg3); color:var(--muted); margin-right:5px}
  .pill.g{background:#123a26; color:#5ee89a}
  .pill.y{background:#3a2e12; color:#f0c66b}
  .pill.r{background:#3a1212; color:#ff9090}
  .pill.b{background:#12294a; color:#8bbcff}
  .empty{color:var(--muted); font-size:13px; padding:24px; text-align:center;
    border:1px dashed var(--border); border-radius:11px}
  .progress{height:8px; background:var(--bg3); border-radius:5px; overflow:hidden}
  .progress > div{height:100%; background:linear-gradient(90deg,var(--accent),var(--purple)); transition:width .3s}
  .kv{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px}
  .kv:last-child{border-bottom:none}
  .badge{display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; background:var(--bg3)}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
  .chip{padding:6px 13px; border-radius:20px; background:var(--bg3); border:1px solid var(--border);
    cursor:pointer; font-size:12px; transition:.15s}
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .ideas-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px}
  .idea{background:var(--bg2); border:1px solid var(--border); border-radius:13px;
    padding:16px; display:flex; flex-direction:column; transition:.15s}
  .idea:hover{border-color:#3a465e; transform:translateY(-2px)}
  .idea h4{font-size:14px; margin-bottom:8px}
  .idea p{font-size:12.5px; color:var(--muted); line-height:1.55; flex:1; margin-bottom:12px}
  .idea .tags{margin-bottom:12px}

  /* ============ МАТЕРИАЛЫ / ИНФА СОТКА ============ */
  .mat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px}
  .mat-card{
    background:var(--bg2); border:1px solid var(--border); border-radius:16px;
    overflow:hidden; cursor:pointer; transition:.2s; display:flex; flex-direction:column;
    position:relative;
  }
  .mat-card:hover{transform:translateY(-3px); border-color:var(--accent); box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .mat-cover{
    height:170px; position:relative; display:flex; align-items:center; justify-content:center;
    overflow:hidden; border-bottom:1px solid var(--border);
  }
  .mat-cover .big-emoji{font-size:64px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.35)); z-index:2}
  .mat-cover .pattern{
    position:absolute; inset:0; opacity:.15;
    background-image:
      linear-gradient(rgba(255,255,255,.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.4) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .mat-cover .pages-badge{
    position:absolute; top:10px; right:10px; background:rgba(0,0,0,.55); color:#fff;
    padding:4px 9px; border-radius:20px; font-size:11px; font-weight:600; z-index:3;
    backdrop-filter:blur(4px);
  }
  .mat-cover .tag-badge{
    position:absolute; top:10px; left:10px; background:rgba(255,255,255,.92); color:#0f1a2c;
    padding:4px 10px; border-radius:20px; font-size:10.5px; font-weight:700; z-index:3;
    text-transform:uppercase; letter-spacing:.4px;
  }
  .mat-cover .read-badge{
    position:absolute; bottom:10px; left:10px; background:var(--accent2); color:#fff;
    padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:700; z-index:3;
    display:none;
  }
  .mat-card.read .read-badge{display:inline-block}
  .mat-body{padding:14px 16px 16px; display:flex; flex-direction:column; flex:1}
  .mat-body h4{font-size:14.5px; margin-bottom:6px; line-height:1.35}
  .mat-body p{font-size:12.5px; color:var(--muted); line-height:1.5; flex:1}
  .mat-body .open-hint{margin-top:10px; font-size:11.5px; color:var(--accent); font-weight:600;
    display:flex; align-items:center; gap:5px}
  .mat-actions{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap}

  /* Просмотрщик PDF */
  .pdf-viewer{
    position:fixed; inset:0; z-index:250; background:#0a0f1a;
    display:none; flex-direction:column; color:#e6ecf5;
  }
  .pdf-viewer.show{display:flex}
  .pdf-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 16px; background:#111827; border-bottom:1px solid #1e2638;
    flex-wrap:wrap;
  }
  .pdf-header .left{display:flex; align-items:center; gap:12px; min-width:0; flex:1}
  .pdf-header .icon-box{
    width:36px; height:36px; border-radius:9px; display:grid; place-items:center;
    font-size:20px; flex-shrink:0;
  }
  .pdf-header .title-wrap{min-width:0; flex:1}
  .pdf-header .title-wrap b{font-size:14px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pdf-header .title-wrap small{color:#8a97ad; font-size:11.5px}
  .pdf-header .right{display:flex; gap:6px; flex-wrap:wrap}
  .pdf-frame-wrap{flex:1; position:relative; background:#0a0f1a}
  .pdf-frame{width:100%; height:100%; border:none; background:#fff}
  .pdf-placeholder{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:30px; color:#8a97ad; gap:12px;
  }
  .pdf-placeholder.show{display:flex}
  .pdf-placeholder .big{font-size:60px}
  .pdf-placeholder code{
    background:#1e2638; padding:4px 10px; border-radius:6px; color:#8bbcff;
    font-size:12.5px; font-family:monospace;
  }

  .kanban{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
  .col{background:var(--bg2); border:1px solid var(--border); border-radius:13px; padding:14px; min-height:220px}
  .col-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
  .col-head h4{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted)}
  .col-head .count{font-size:11px; background:var(--bg3); padding:2px 8px; border-radius:20px}
  .task{background:var(--bg3); border:1px solid var(--border); border-radius:9px;
    padding:10px 12px; margin-bottom:8px; font-size:13px; cursor:grab;
    display:flex; flex-direction:column; gap:6px}
  .task:active{cursor:grabbing}
  .task .row1{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
  .task .del{color:var(--muted); cursor:pointer; font-size:15px; line-height:1}
  .task .del:hover{color:var(--danger)}
  .task .meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11px; color:var(--muted)}
  .task .assignee{padding:1px 7px; border-radius:20px; font-size:10px; font-weight:600; color:#fff}
  .col.dragover{border-color:var(--accent); background:#1a2438}
  .add-task{display:flex; gap:6px; margin-top:8px}
  .add-task input{font-size:12px; padding:7px 10px}

  .journal-entry{background:var(--bg2); border:1px solid var(--border); border-radius:11px;
    padding:14px 16px; margin-bottom:10px; display:flex; gap:14px}
  .journal-date{min-width:90px; font-size:12px; color:var(--muted);
    border-right:1px solid var(--border); padding-right:14px}
  .journal-body{flex:1; font-size:13px; line-height:1.55; white-space:pre-wrap}
  .journal-body b{display:block; margin-bottom:4px; font-size:13.5px}
  .reflect-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:8px}
  .reflect-3 .field{margin:0}

  .tool-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px}
  .tool-card{background:var(--bg2); border:1px solid var(--border); border-radius:13px; padding:18px 20px}
  .tool-card h3{font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px}
  .tool-card.wide{grid-column:span 2}
  .pomo{text-align:center}
  .pomo-time{font-size:52px; font-weight:700; font-variant-numeric:tabular-nums; margin:8px 0 4px; letter-spacing:2px}
  .pomo-mode{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:14px}
  .pomo-actions{display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap}
  .pomo-task{margin-top:12px; font-size:12px}
  .sm-grid{display:grid; grid-template-columns:60px 1fr; gap:10px 12px; align-items:start}
  .sm-grid label{color:var(--accent); font-weight:700; font-size:14px; padding-top:10px}
  .brainstorm-list{list-style:none; margin-bottom:12px}
  .brainstorm-list li{background:var(--bg3); border:1px solid var(--border); border-radius:9px;
    padding:9px 12px; margin-bottom:6px; font-size:13px; display:flex; justify-content:space-between; gap:8px; align-items:center}
  .vote{padding:2px 8px; border-radius:20px; background:var(--bg2); cursor:pointer; font-size:11px; border:1px solid var(--border)}
  .vote:hover{border-color:var(--accent)}
  .vote.voted{background:var(--accent); color:#fff; border-color:var(--accent)}
  .eisen{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .quad{border:1px solid var(--border); border-radius:10px; padding:12px; min-height:120px}
  .quad h5{font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; color:var(--muted)}
  .quad.q1{border-color:#7a2b2b; background:#1f1414}
  .quad.q2{border-color:#2b5a3a; background:#13201a}
  .quad.q3{border-color:#7a622b; background:#1f1c14}
  .quad.q4{border-color:#3a3a4a; background:#16161f}
  html[data-theme="light"] .quad.q1{background:#fef2f2; border-color:#fca5a5}
  html[data-theme="light"] .quad.q2{background:#f0fdf4; border-color:#86efac}
  html[data-theme="light"] .quad.q3{background:#fffbeb; border-color:#fcd34d}
  html[data-theme="light"] .quad.q4{background:#f8fafc; border-color:#cbd5e1}
  .quad-item{font-size:12px; padding:4px 0; display:flex; justify-content:space-between; gap:6px}
  .quad-item span{color:var(--muted); cursor:pointer}
  .quad-item span:hover{color:var(--danger)}
  .gantt-row{display:grid; grid-template-columns:1fr 110px 110px 70px; gap:8px; margin-bottom:6px; align-items:center}
  .gantt-row input{font-size:12px; padding:6px 9px}
  .gantt-bar-wrap{height:8px; background:var(--bg3); border-radius:4px; overflow:hidden; margin:-2px 0 10px}
  .gantt-bar{height:100%; background:linear-gradient(90deg,var(--accent),var(--purple))}
  .ishi-cat{margin-bottom:10px}
  .ishi-cat h5{font-size:12px; color:var(--accent); margin-bottom:5px}

  .stage{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border)}
  .stage .box{width:20px; height:20px; border-radius:6px; border:2px solid var(--border); cursor:pointer;
    display:grid; place-items:center; font-size:13px; transition:.15s; flex-shrink:0}
  .stage.done .box{background:var(--accent2); border-color:var(--accent2); color:#fff}
  .stage.done .label{text-decoration:line-through; color:var(--muted)}
  .stage .label{flex:1; font-size:14px}
  .stage-block{padding:14px 0; border-bottom:1px solid var(--border)}
  .stage-block:last-child{border-bottom:none}
  .stage-block .stage{border-bottom:none; padding:0}
  .stage-task{display:flex; gap:8px; align-items:center; margin-bottom:6px}
  .stage-task input{flex:1; padding:6px 10px; font-size:12px}

  .crit-row{display:grid; grid-template-columns:1fr 130px; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border)}
  .crit-row:last-child{border-bottom:none}
  .crit-row .name{font-size:13px}
  .crit-row .hint{font-size:11px; color:var(--muted); margin-top:2px}
  .crit-row select{padding:6px 10px; font-size:12px}

  .member{display:flex; align-items:flex-start; gap:10px; padding:12px; background:var(--bg3);
    border:1px solid var(--border); border-radius:9px; margin-bottom:10px}
  .avatar{width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
    font-weight:700; font-size:14px; color:#fff; flex-shrink:0; margin-top:2px}
  .member .info{flex:1; font-size:13px; display:flex; flex-direction:column; gap:6px}
  .member .info small{color:var(--muted); font-size:11.5px}

  .xray-row{display:grid; grid-template-columns:1fr 80px; gap:10px; padding:6px 0; font-size:12.5px; align-items:center}
  .xray-bar{height:6px; background:var(--bg3); border-radius:3px; overflow:hidden}
  .xray-bar > div{height:100%; background:var(--accent)}
  .xray-weak .xray-bar > div{background:var(--danger)}
  .xray-mid .xray-bar > div{background:var(--warn)}
  .xray-ok .xray-bar > div{background:var(--accent2)}

  .heatmap{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,12px); gap:3px; overflow-x:auto; padding-bottom:8px}
  .heat-cell{width:12px; height:12px; border-radius:3px; background:var(--bg3)}
  .heat-cell.l1{background:#1e4a2b}
  .heat-cell.l2{background:#2f7a3f}
  .heat-cell.l3{background:#22c55e}
  .heat-cell.l4{background:#86efac}
  html[data-theme="light"] .heat-cell.l1{background:#bbf7d0}
  html[data-theme="light"] .heat-cell.l2{background:#86efac}
  html[data-theme="light"] .heat-cell.l3{background:#22c55e}
  html[data-theme="light"] .heat-cell.l4{background:#16a34a}

  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .cal-head{font-size:11px; color:var(--muted); text-align:center; padding:6px 0; font-weight:600}
  .cal-cell{background:var(--bg2); border:1px solid var(--border); border-radius:9px;
    padding:7px; min-height:76px; font-size:11.5px}
  .cal-cell.other{opacity:.4}
  .cal-cell.today{border-color:var(--accent)}
  .cal-cell .d{font-weight:600; margin-bottom:4px; font-size:12px}
  .cal-event{font-size:10.5px; background:var(--accent); color:#fff; padding:1px 5px;
    border-radius:4px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  .overlay{position:fixed; inset:0; background:var(--overlay); z-index:100;
    display:none; align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(4px)}
  .overlay.show{display:flex}
  .modal{background:var(--bg2); border:1px solid var(--border); border-radius:16px;
    max-width:720px; width:100%; max-height:88vh; overflow:auto; padding:24px 26px}
  .modal h2{font-size:19px; margin-bottom:8px}
  .modal p.sub{color:var(--muted); font-size:13px; margin-bottom:18px}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:20px}

  .search-input{font-size:16px; padding:12px 14px}
  .search-results{max-height:55vh; overflow-y:auto; margin-top:14px}
  .search-group{margin-bottom:14px}
  .search-group h4{font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:.6px; margin-bottom:6px}
  .search-item{padding:9px 12px; border-radius:9px; cursor:pointer; font-size:13px}
  .search-item:hover{background:var(--bg3)}
  .search-item small{display:block; color:var(--muted); font-size:11.5px; margin-top:2px}

  .wiz-steps{display:flex; gap:8px; margin-bottom:20px}
  .wiz-step{flex:1; height:5px; border-radius:3px; background:var(--bg3)}
  .wiz-step.active{background:var(--accent)}
  .wiz-step.done{background:var(--accent2)}
  .tpl-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}

function defaultState(){
  return {
    version: SCHEMA,
    section: 'ideas',
    projectTab: 'overview',
    ideaFilter: 'Все',
    materialFilter: 'Все',
    theme: 'dark',
    onboarded: false,
    mentorMode: false,
    templateId: null,
    project: {},
    stages: DEFAULT_STAGES.map((label,i) => ({
      id:'s'+i, label, done:false, start:'', end:'', tasks:[], result:''
    })),
    reflection: [],
    assessment: {},
    kanban: {todo:[], doing:[], done:[]},
    taskLog: [],
    team: [],
    journal: [],
    resources: [],
    brainstorm: [],
    eisen: {q1:[], q2:[], q3:[], q4:[]},
    gantt: [],
    ishi: {people:'',methods:'',machines:'',materials:'',measurement:'',environment:''},
    smart: {s:'',m:'',a:'',r:'',t:''},
    pomo: { sessions: [], focusTaskId: null },
    history: [],
    mentorComments: {},
    materialsRead: [],
    lastSaved: null
  };
}

function migrate(raw){
  if(!raw) return defaultState();
  const def = defaultState();
  const out = Object.assign({}, def, raw);
  delete out.ai;
  out.kanban = Object.assign({}, def.kanban, raw.kanban || {});
  out.eisen = Object.assign({}, def.eisen, raw.eisen || {});
  out.ishi = Object.assign({}, def.ishi, raw.ishi || {});
  out.smart = Object.assign({}, def.smart, raw.smart || {});
  out.pomo = Object.assign({}, def.pomo, raw.pomo || {});
  if(!Array.isArray(out.materialsRead)) out.materialsRead = [];

  if(Array.isArray(out.stages) && out.stages.length){
    out.stages = out.stages.map(s => ({
      id: s.id || uid(),
      label: s.label || '',
      done: !!s.done,
      start: s.start || '',
      end: s.end || '',
      tasks: Array.isArray(s.tasks)
        ? s.tasks.map(t => ({ id: t.id || uid(), text: t.text || '' }))
        : [],
      result: s.result || ''
    }));
  } else {
    out.stages = DEFAULT_STAGES.map((label,i) => ({
      id:'s'+i, label, done:false, start:'', end:'', tasks:[], result:''
    }));
  }

  if(Array.isArray(out.team)){
    out.team = out.team.map((m,i) => ({
      id: m.id || uid(),
      name: m.name || '',
      role: m.role || '',
      color: m.color || MEMBER_COLORS[i % MEMBER_COLORS.length],
      organization: m.organization || '',
      klass: m.klass || '',
      contacts: m.contacts || ''
    }));
  }

  out.version = SCHEMA;
  return out;
}

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    return migrate(raw ? JSON.parse(raw) : null);
  }catch(e){
    console.warn('migrate error', e);
    return defaultState();
  }
}

let _saveTimer = null;
function save(){
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(doSave, 250);
}
function doSave(){
  try{
    state.lastSaved = Date.now();
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    const el = document.getElementById('saveTime');
    if(el) el.textContent = 'Сохранено ' + new Date().toLocaleTimeString('ru-RU');
  }catch(e){
    toast('Не удалось сохранить: ' + e.message, true);
  }
}

const UNDO = [];
const UNDO_MAX = 50;
function snapshot(){
  try{
    const clone = JSON.parse(JSON.stringify(state));
    clone.history = [];
    UNDO.push(clone);
    if(UNDO.length > UNDO_MAX) UNDO.shift();
  }catch(e){}
}
function undo(){
  if(!UNDO.length) return toast('Нечего отменять', true);
  const prev = UNDO.pop();
  const keepHistory = state.history;
  state = migrate(prev);
  state.history = keepHistory;
  save(); renderNav(); renderMain();
  toast('Отменено');
}

function takeHistorySnapshot(label){
  const clone = JSON.parse(JSON.stringify(state));
  clone.history = [];
  state.history.unshift({ ts: Date.now(), label: label || 'снимок', data: clone });
  state.history = state.history.slice(0, 20);
  save();
}

  return String(s ?? '').replace(/[&<>"']/g, c => (

  ));
}
function toast(msg, isErr=false){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);

function fmtDate(d=new Date()){
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtRuDate(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
  }catch(e){ return iso; }
}
function fmtTime(ts){
  return new Date(ts).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function dayKey(d){ return new Date(d).toISOString().slice(0,10); }
function download(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);

function safeFilename(s){
  return (s||'проект').replace(/[^\wа-яёА-ЯЁ\-\s]/gi,'').replace(/\s+/g,'_').slice(0,60);
}
function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---- Просмотрщик PDF ---- */
let currentPdfId = null;

function openPdf(id){
  const m = MATERIALS.find(x => x.id === id);
  if(!m) return;
  currentPdfId = id;

  $('#pdfIcon').textContent = m.icon;
  $('#pdfIcon').style.background = `linear-gradient(135deg, ${m.color}, ${m.color2})`;
  $('#pdfTitle').textContent = m.title;
  $('#pdfMeta').textContent = `${m.tag} · ${m.pages} стр. · ${m.file}`;

  const frame = $('#pdfFrame');
  const placeholder = $('#pdfPlaceholder');
  frame.src = m.file;

  // Пробуем понять, загрузился ли файл
  frame.onload = () => {
    // Не всегда надёжно, но попробуем
    try{
      // Cross-origin PDF обычно грузится, но мы не можем узнать статус.
      // Оставим placeholder скрытым.
      placeholder.classList.remove('show');
    }catch(e){}
  };
  frame.onerror = () => {
    placeholder.classList.add('show');
    $('#pdfExpectedPath').textContent = 'Ожидаемый файл: ' + m.file;
  };

  // Дополнительно проверим через fetch HEAD, что файл существует
  fetch(m.file, { method:'HEAD' })
    .then(r => {
      if(!r.ok){
        placeholder.classList.add('show');
        $('#pdfExpectedPath').textContent = 'Ожидаемый файл: ' + m.file;
        frame.src = 'about:blank';
      } else {
        placeholder.classList.remove('show');
      }
    })
    .catch(() => {
      // Скорее всего, файла нет
      placeholder.classList.add('show');
      $('#pdfExpectedPath').textContent = 'Ожидаемый файл: ' + m.file;
    });

  updateReadButton();
  $('#pdfViewer').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closePdf(){
  $('#pdfViewer').classList.remove('show');
  $('#pdfFrame').src = 'about:blank';
  currentPdfId = null;
  document.body.style.overflow = '';
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

function updateReadButton(){
  const btn = $('#pdfReadToggle');
  if(!currentPdfId) return;
  const isRead = state.materialsRead.includes(currentPdfId);
  btn.textContent = isRead ? '✓ Прочитано' : '✓ Отметить прочитанным';
  btn.classList.toggle('success', isRead);
}

$('#pdfClose').onclick = closePdf;
$('#pdfDownload').onclick = () => {
  if(!currentPdfId) return;
  const m = MATERIALS.find(x => x.id === currentPdfId);
  if(!m) return;
  const a = document.createElement('a');
  a.href = m.file; a.download = '';
  document.body.appendChild(a); a.click();
  setTimeout(()=>a.remove(), 500);
};
$('#pdfFullscreen').onclick = () => {
  const el = $('#pdfViewer');
  if(document.fullscreenElement){
    document.exitFullscreen();
  } else if(el.requestFullscreen){
    el.requestFullscreen();
  } else {
    toast('Fullscreen недоступен в этом браузере', true);
  }
};
$('#pdfReadToggle').onclick = () => {
  if(!currentPdfId) return;
  snapshot();
  const idx = state.materialsRead.indexOf(currentPdfId);
  if(idx > -1){
    state.materialsRead.splice(idx,1);
    toast('Снята отметка «Прочитано»');
  } else {
    state.materialsRead.push(currentPdfId);
    toast('Отмечено как прочитанное');
  }
  save();
  updateReadButton();
  // Обновим карточки, если пользователь вернётся
};

// Esc для закрытия просмотрщика PDF
document.addEventListener('keydown', e => {

});

        <div class="kv"><span class="muted">Тип</span><b>${wizState.tpl ? TEMPLATES[wizState.tpl].name : '—'}</b></div>
        <div class="kv"><span class="muted">Дедлайн</span><b>${esc(wizState.deadline || '—')}</b></div>
      </div>`;
  }

  ['wizName','wizGoal','wizDeadline'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.oninput = () => {
      if(id==='wizName') wizState.name = el.value;
      if(id==='wizGoal') wizState.goal = el.value;
      if(id==='wizDeadline') wizState.deadline = el.value;
    };
  });
}

$('#wizSkip').onclick = () => { state.onboarded = true; save(); closeWizard(); };
$('#wizBack').onclick = () => { wizState.step = Math.max(0, wizState.step-1); renderWizard(); };
$('#wizNext').onclick = () => {
  if(wizState.step === 1 && !wizState.tpl) return toast('Выбери тип проекта', true);
  if(wizState.step < 3){ wizState.step++; renderWizard(); return; }
  applyWizard();
};

function applyWizard(){
  snapshot();
  const tpl = wizState.tpl ? TEMPLATES[wizState.tpl] : TEMPLATES.engineering;
  state.templateId = wizState.tpl;
  state.project.name = wizState.name || 'Новый проект';
  state.project.goal = wizState.goal || '';
  if(wizState.deadline) state.project.contacts = (state.project.contacts||'') + '\nДедлайн: ' + wizState.deadline;
  state.stages = tpl.stages.map((label,i) => ({
    id:'s'+i, label, done:false, start:'', end:'', tasks:[], result:''
  }));
  state.kanban.todo = tpl.tasks.todo.map(text => ({id:uid(), text}));
  state.kanban.doing = [];
  state.kanban.done = [];
  if(!state.gantt.length){
    const today = new Date();
    const end = new Date(); end.setDate(end.getDate() + 30);
    state.gantt = [{id:uid(), name:'Работа над проектом',
      start: today.toISOString().slice(0,10),
      end: end.toISOString().slice(0,10), done:0, total:100}];
  }
  state.onboarded = true;
  save();
  closeWizard();
  state.section = 'project'; state.projectTab = 'overview';
  renderNav(); renderMain();
  takeHistorySnapshot('создан из мастера');
  toast('Проект создан!');
}

function openSearch(){
  $('#searchOverlay').classList.add('show');
  const inp = $('#searchInput');
  inp.value = ''; inp.focus();
  renderSearch('');
}
function closeSearch(){ $('#searchOverlay').classList.remove('show'); }
$('#searchOverlay').addEventListener('click', e => {
  if(e.target === $('#searchOverlay')) closeSearch();
});

function renderSearch(q){
  q = q.trim().toLowerCase();
  const results = [];
  function push(group, items){ if(items.length) results.push({group, items}); }

  push('Материалы', MATERIALS
    .filter(m => !q || (m.title+' '+m.desc+' '+m.tag).toLowerCase().includes(q))
    .slice(0, 5)
    .map(m => ({label:m.icon+' '+m.title, sub:m.desc.slice(0,90), action:()=>{
      state.section='materials'; state.materialFilter=m.tag; save(); closeSearch(); renderNav(); renderMain();
      setTimeout(()=>openPdf(m.id), 200);
    }})));

  push('Идеи', IDEA_LIBRARY
    .filter(i => !q || (i.title+' '+i.desc+' '+i.tags.join(' ')+' '+i.cat).toLowerCase().includes(q))
    .slice(0, 5)
    .map(i => ({label:i.title, sub:i.cat, action:()=>{
      state.section='ideas'; state.ideaFilter=i.cat; save(); closeSearch(); renderNav(); renderMain();
    }})));

  push('Проектная карта', PROJECT_CARD_FIELDS
    .filter(f => { const v = state.project[f.key]||''; return v && (!q || v.toLowerCase().includes(q) || f.label.toLowerCase().includes(q)); })
    .slice(0, 5)
    .map(f => ({label:f.label, sub:(state.project[f.key]||'').slice(0,90), action:()=>{
      state.section='project'; state.projectTab='card'; save(); closeSearch(); renderNav(); renderMain();
      setTimeout(()=>{ const el = document.querySelector(`[data-field="${f.key}"]`); if(el){ el.scrollIntoView({block:'center'}); el.focus(); }}, 100);
    }})));

  push('Задачи', allTasks()
    .filter(t => !q || t.text.toLowerCase().includes(q)).slice(0, 6)
    .map(t => ({label:t.text, sub:{todo:'Надо сделать', doing:'В работе', done:'Готово'}[t.col], action:()=>{
      state.section='project'; state.projectTab='kanban'; save(); closeSearch(); renderNav(); renderMain();
    }})));

  push('Журнал', state.journal
    .filter(j => !q || (j.title+' '+j.text).toLowerCase().includes(q)).slice(0, 5)
    .map(j => ({label:j.title || '(без заголовка)', sub:j.date+' — '+j.text.slice(0,80), action:()=>{
      state.section='project'; state.projectTab='journal'; save(); closeSearch(); renderNav(); renderMain();
    }})));

  const html = results.length
    ? results.map(g => `
      <div class="search-group">
        <h4>${g.group}</h4>
        ${g.items.map((it,i) => `<div class="search-item" data-g="${results.indexOf(g)}" data-i="${i}">
          ${esc(it.label)}${it.sub?`<small>${esc(it.sub)}</small>`:''}
        </div>`).join('')}
      </div>`).join('')
    : '<div class="empty">Ничего не найдено</div>';

  $('#searchResults').innerHTML = html;
  $$('#searchResults .search-item').forEach(el => {
    el.onclick = () => {
      const g = results[+el.dataset.g], i = +el.dataset.i;
      g.items[i].action();
    };
  });
}
$('#searchInput').addEventListener('input', e => renderSearch(e.target.value));
$('#searchBtn').onclick = openSearch;

function renderIdeas(main){
  const cats = ['Все', ...IDEA_CATEGORIES];
  const list = state.ideaFilter === 'Все' ? IDEA_LIBRARY : IDEA_LIBRARY.filter(i => i.cat === state.ideaFilter);

  main.innerHTML = `
    <h1 class="page-title">Библиотека идей</h1>
    <p class="page-sub">${IDEA_LIBRARY.length} кейсов. Выбери направление или возьми идею в проект.</p>
    <div class="filters">
      ${cats.map(c => `<div class="chip ${state.ideaFilter===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</div>`).join('')}
    </div>
    <div class="ideas-grid">
      ${list.map(i => `
        <div class="idea">
          <h4>${esc(i.title)}</h4>
          <div class="tags">
            <span class="pill b">${esc(i.cat)}</span>
            <span class="pill ${i.diff==='лёгкий'?'g':i.diff==='средний'?'y':'r'}">${esc(i.diff)}</span>
          </div>
          <p>${esc(i.desc)}</p>
          <div class="tags">${i.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>
          <button class="btn primary sm" data-take="${i.id}">Взять в проект</button>
        </div>`).join('')}
    </div>
  `;
  $$('.chip', main).forEach(el => {
    el.onclick = () => { state.ideaFilter = el.dataset.cat; save(); renderIdeas(main); };
  });
  $$('[data-take]', main).forEach(el => {
    el.onclick = () => {
      const idea = IDEA_LIBRARY.find(i => i.id === el.dataset.take);
      if(!idea) return;
      snapshot();
      state.project.name = idea.title;
      state.project.description = idea.desc;
      state.project.tags = idea.tags;
      if(!state.templateId){
        const t = TEMPLATES.engineering;
        state.stages = t.stages.map((label,i) => ({id:'s'+i, label, done:false, start:'', end:'', tasks:[], result:''}));
        state.kanban.todo = t.tasks.todo.map(text => ({id:uid(), text}));
      }
      save();
      state.section = 'project'; state.projectTab = 'overview';
      renderNav(); renderMain();
      takeHistorySnapshot('идея взята');
      toast('Идея добавлена');
    };
  });

function renderCard(body){
  body.innerHTML = `
    <div class="card">
      <h3>Проектная карта</h3>
      <p class="muted" style="font-size:12.5px;margin-bottom:16px">
        Заполни все разделы своими словами. Это основа защиты проекта.
      </p>
      ${PROJECT_CARD_FIELDS.map(f => {
        const val = state.project[f.key] || '';
        const mc = state.mentorComments['card:'+f.key];
        return `
        <div class="field">
          <label style="display:flex;justify-content:space-between;align-items:center">
            <span>${esc(f.label)}</span>
            ${state.mentorMode?`<button class="btn sm ghost" data-mc="card:${f.key}">💬 Ментор</button>`:''}
          </label>
          <textarea data-field="${f.key}" placeholder="${esc(f.ph)}">${esc(val)}</textarea>
          ${mc?`<div class="mentor-note">🎓 ${esc(mc)}</div>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
  $$('[data-field]', body).forEach(el => {
    let dirty = false;
    el.onfocus = () => { if(!dirty){ snapshot(); dirty = true; } };
    el.oninput = () => { state.project[el.dataset.field] = el.value; save(); };
  });
  $$('[data-mc]', body).forEach(el => {
    el.onclick = () => askMentorComment(el.dataset.mc);
  });
}

function askMentorComment(key){
  if(!state.mentorMode) return toast('Включи менторский режим', true);
  const cur = state.mentorComments[key] || '';
  const note = prompt('Комментарий ментора:', cur);
  if(note === null) return;
  snapshot();
  if(note.trim()) state.mentorComments[key] = note.trim();
  else delete state.mentorComments[key];
  save(); renderProject($('#main'));
}

function renderStages(body){
  const done = state.stages.filter(s => s.done).length;
  const pct = state.stages.length ? Math.round(done/state.stages.length*100) : 0;
  body.innerHTML = `
    <div class="card">
      <h3>Этапы и задачи в проекте
        <span class="muted" style="font-size:12px">${done}/${state.stages.length}</span>
      </h3>
      <p class="muted" style="font-size:12.5px;margin-bottom:14px">
        Эти данные автоматически попадут в проектную карту Кванториума (берутся первые 4 этапа).
      </p>
      <div class="progress" style="margin-bottom:14px"><div style="width:${pct}%"></div></div>
      ${state.stages.map((s, idx) => `
        <div class="stage-block">
          <div class="stage ${s.done?'done':''}">
            <div class="box" data-toggle="${s.id}">${s.done?'✓':''}</div>
            <div class="label" contenteditable="true" data-edit="${s.id}">${esc(s.label)}</div>
            <span class="badge">Этап ${idx+1}</span>
            <button class="btn danger sm" data-sdel="${s.id}">×</button>
          </div>
          <div class="row c2" style="margin:12px 0 0 32px">
            <div class="field" style="margin:0">
              <label>Срок реализации — от</label>
              <input type="date" value="${esc(s.start||'')}" data-sdate="start" data-sid="${s.id}">
            </div>
            <div class="field" style="margin:0">
              <label>Срок реализации — до</label>
              <input type="date" value="${esc(s.end||'')}" data-sdate="end" data-sid="${s.id}">
            </div>
          </div>
          <div style="margin:12px 0 0 32px">
            <label style="margin-bottom:6px">Задачи этапа</label>
            <div>
              ${(s.tasks||[]).map((t,i) => `
                <div class="stage-task">
                  <span class="muted" style="font-size:12px;min-width:26px">${idx+1}.${i+1}.</span>
                  <input value="${esc(t.text)}" data-stask="text" data-sid="${s.id}" data-tid="${t.id}">
                  <button class="btn danger sm" data-staskdel="${s.id}:${t.id}">×</button>
                </div>`).join('')}
            </div>
            <div class="add-task">
              <input placeholder="Новая задача этапа…" data-staskinput="${s.id}">
              <button class="btn primary sm" data-staskadd="${s.id}">+</button>
            </div>
          </div>
          <div class="field" style="margin:12px 0 0 32px">
            <label>Планируемый результат по этапу</label>
            <textarea data-sresult="${s.id}" placeholder="Что должно быть получено к концу этапа" style="min-height:52px">${esc(s.result||'')}</textarea>
          </div>
        </div>
      `).join('')}
      <div style="display:flex;gap:6px;margin-top:16px">
        <input id="newStage" placeholder="Новый этап…">
        <button class="btn primary" id="addStage">+</button>
      </div>
    </div>
  `;

  $$('[data-toggle]', body).forEach(el => {
    el.onclick = () => {
      snapshot();
      const s = state.stages.find(x => x.id === el.dataset.toggle);
      if(s){ s.done = !s.done; save(); renderStages(body); }
    };
  });
  $$('[data-edit]', body).forEach(el => {
    el.onblur = () => {
      const s = state.stages.find(x => x.id === el.dataset.edit);
      if(s && s.label !== el.textContent){ snapshot(); s.label = el.textContent; save(); }
    };
  });
  $$('[data-sdel]', body).forEach(el => {
    el.onclick = () => { snapshot(); state.stages = state.stages.filter(x => x.id !== el.dataset.sdel); save(); renderStages(body); };
  });
  $$('[data-sdate]', body).forEach(el => {
    el.onchange = () => {
      const s = state.stages.find(x => x.id === el.dataset.sid);
      if(s){ s[el.dataset.sdate] = el.value; save(); }
    };
  });
  $$('[data-stask]', body).forEach(el => {
    el.onchange = () => {
      const s = state.stages.find(x => x.id === el.dataset.sid);
      if(!s) return;
      const t = s.tasks.find(x => x.id === el.dataset.tid);
      if(t){ t.text = el.value; save(); }
    };
  });
  $$('[data-staskdel]', body).forEach(el => {
    el.onclick = () => {
      const [sid, tid] = el.dataset.staskdel.split(':');
      const s = state.stages.find(x => x.id === sid);
      if(s){ s.tasks = s.tasks.filter(t => t.id !== tid); save(); renderStages(body); }
    };
  });
  $$('[data-staskadd]', body).forEach(btn => {
    btn.onclick = () => {
      const sid = btn.dataset.staskadd;
      const inp = $(`[data-staskinput="${sid}"]`, body);
      const text = inp.value.trim();
      if(!text) return;
      const s = state.stages.find(x => x.id === sid);
      if(!s) return;
      s.tasks = s.tasks || [];
      s.tasks.push({ id: uid(), text });
      save(); renderStages(body);
    };
  });
  $$('[data-staskinput]', body).forEach(inp => {

function renderKanban(body){

                  <select data-assign="${t.id}" style="width:auto;padding:2px 6px;font-size:11px">
                    <option value="">— исполнитель —</option>
                    ${state.team.map(x => `<option value="${x.id}" ${t.assignee===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}
                  </select>
                  ${state.mentorMode?`<button class="btn sm ghost" data-mctask="${t.id}" style="padding:2px 8px">💬</button>`:''}
                </div>
                ${mc?`<div class="mentor-note">🎓 ${esc(mc)}</div>`:''}
              </div>`;
            }).join('')}
          </div>
          <div class="add-task">
            <input type="text" placeholder="Новая задача…" data-input="${c.id}">
            <button class="btn primary sm" data-add="${c.id}">+</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  $('#filterMember', body).onchange = e => { state._filterMember = e.target.value; renderKanban(body); };

  $$('[data-add]', body).forEach(btn => btn.onclick = () => addTask(btn.dataset.add));
  $$('[data-input]', body).forEach(inp => inp.onkeydown = e => { if(e.key === 'Enter') addTask(inp.dataset.input); });

  function addTask(col){
    const inp = $(`[data-input="${col}"]`, body);
    const text = inp.value.trim();
    if(!text) return;
    snapshot();
    state.kanban[col].push({id:uid(), text});
    state.taskLog.push({ts:Date.now(), taskId:null, action:'create', to:col});
    save(); renderKanban(body);
  }
  $$('[data-del]', body).forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      snapshot();
      const id = el.dataset.del;
      for(const k in state.kanban) state.kanban[k] = state.kanban[k].filter(t => t.id !== id);
      save(); renderKanban(body);
    };
  });
  $$('[data-assign]', body).forEach(el => {
    el.onchange = () => {
      snapshot();
      const t = findTask(el.dataset.assign);
      if(t){ t.t.assignee = el.value || undefined; save(); renderKanban(body); }
    };
  });
  $$('[data-mctask]', body).forEach(el => {
    el.onclick = e => { e.stopPropagation(); askMentorComment('task:'+el.dataset.mctask); };
  });

  let dragId = null;
  $$('.task', body).forEach(el => {
    el.addEventListener('dragstart', () => { dragId = el.dataset.id; el.style.opacity = .4; });
    el.addEventListener('dragend',   () => { el.style.opacity = 1; dragId = null; });
  });
  $$('.col', body).forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('dragover');
      if(!dragId) return;
      snapshot();
      const to = col.dataset.col;
      let task = null, from = null;
      for(const k in state.kanban){
        const idx = state.kanban[k].findIndex(t => t.id === dragId);
        if(idx > -1){ task = state.kanban[k].splice(idx,1)[0]; from = k; break; }
      }
      if(task){
        state.kanban[to].push(task);
        state.taskLog.push({ts:Date.now(), taskId:task.id, action:'move', from, to});
      }
      save(); renderKanban(body);
    });
  });
}

function drawBurndown(c){
  if(!c) return;
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = 220;
  c.width = W*dpr; c.height = H*dpr;
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent').trim() || '#4f8cff';
  const muted = css.getPropertyValue('--muted').trim() || '#8a97ad';
  const border = css.getPropertyValue('--border').trim() || '#2a3446';

  const start = state.gantt.length
    ? new Date(Math.min(...state.gantt.map(g => +new Date(g.start)))).getTime()
    : Date.now() - 30*86400000;
  const end = state.gantt.length
    ? new Date(Math.max(...state.gantt.map(g => +new Date(g.end)))).getTime()
    : Date.now() + 1;
  const days = Math.max(7, Math.ceil((end - start) / 86400000));
  const totalTasks = allTasks().length;
  if(totalTasks === 0){
    ctx.fillStyle = muted; ctx.font = '13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Нет задач для графика', W/2, H/2);
    return;
  }
  const series = [];
  for(let d = 0; d <= days; d++){
    const t = start + d*86400000;
    const doneByThen = state.taskLog.filter(l => l.action === 'move' && l.to === 'done' && l.ts <= t + 86400000).length;
    series.push({ x: d, y: Math.max(0, totalTasks - doneByThen) });
  }
  if(!state.taskLog.length){
    for(let d = 0; d <= days; d++) series[d].y = d === days ? state.kanban.done.length : totalTasks;
  }
  const padL = 34, padR = 14, padT = 14, padB = 24;
  const cw = W - padL - padR, ch = H - padT - padB;
  ctx.strokeStyle = border; ctx.lineWidth = 1;
  for(let i = 0; i <= 4; i++){
    const y = padT + (ch/4)*i;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL+cw, y); ctx.stroke();
    ctx.fillStyle = muted; ctx.font = '10px sans-serif'; ctx.textAlign='right';
    ctx.fillText(String(Math.round(totalTasks - (totalTasks/4)*i)), padL-6, y+3);
  }
  ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.beginPath();
  series.forEach((p,i) => {
    const x = padL + (cw/days)*p.x;
    const y = padT + ch - (ch/totalTasks)*p.y;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle = muted; ctx.font = '10px sans-serif'; ctx.textAlign='left';
  ctx.fillText(new Date(start).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}), padL, H-6);
  ctx.textAlign='right';
  ctx.fillText(new Date(end).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}), padL+cw, H-6);
}

function drawTimeByTask(c){
  if(!c) return;
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = 220;
  c.width = W*dpr; c.height = H*dpr;
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent').trim();
  const muted = css.getPropertyValue('--muted').trim();
  const byTask = {};
  state.pomo.sessions.forEach(s => { if(s.taskId) byTask[s.taskId] = (byTask[s.taskId]||0) + (s.minutes||0); });
  const entries = Object.entries(byTask).sort((a,b) => b[1]-a[1]).slice(0,7);
  if(!entries.length){
    ctx.fillStyle = muted; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Пока нет сессий Помодоро, привязанных к задачам', W/2, H/2);
    return;
  }
  const max = Math.max(...entries.map(e => e[1]));
  const padL = 130, padR = 30, padT = 10, padB = 10;
  const rowH = (H - padT - padB) / entries.length;
  entries.forEach(([id,min],i) => {
    const t = findTask(id); const label = t ? t.t.text : '—';
    const y = padT + i*rowH;
    const w = ((W - padL - padR) * min) / max;
    ctx.fillStyle = accent; ctx.fillRect(padL, y+4, w, rowH-10);
    ctx.fillStyle = muted; ctx.font='11px sans-serif'; ctx.textAlign='right';
    const short = label.length > 22 ? label.slice(0,21)+'…' : label;
    ctx.fillText(short, padL-8, y+rowH/2+4);
    ctx.textAlign='left';
    ctx.fillStyle = css.getPropertyValue('--text').trim();
    ctx.fillText(min + ' мин', padL + w + 6, y+rowH/2+4);
  });
}

function drawHeatmap(box){
  if(!box) return;
  const days = 91;
  const counts = {};
  state.journal.forEach(j => {
    try{
      const parts = j.date.split('.').reverse().join('-');
      counts[dayKey(new Date(parts))] = (counts[dayKey(new Date(parts))]||0)+1;
    }catch(e){}
  });
  (state.pomo.sessions||[]).forEach(s => { const k = dayKey(s.ts||Date.now()); counts[k] = (counts[k]||0)+1; });
  const cells = [];
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today); start.setDate(start.getDate() - days + 1);
  for(let i=0;i<days;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const k = dayKey(d);
    const n = counts[k] || 0;
    const lvl = n===0?0 : n===1?1 : n<=3?2 : n<=6?3 : 4;
    cells.push(`<div class="heat-cell ${lvl?'l'+lvl:''}" title="${k}: ${n}"></div>`);
  }
  box.innerHTML = cells.join('');
}

function drawCalendar(box){
  if(!box) return;
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1);
  const startDay = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();

  const events = {};
  state.gantt.forEach(g => {
    try{
      const s = new Date(g.start), e = new Date(g.end);
      for(let d = new Date(s); d <= e; d.setDate(d.getDate()+1)){
        if(d.getMonth() === month && d.getFullYear() === year){
          const k = d.getDate();
          (events[k] = events[k] || []).push(g.name);
        }
      }
    }catch(e){}
  });
  state.stages.forEach(st => {
    if(!st.start || !st.end) return;
    try{
      const s = new Date(st.start), e = new Date(st.end);
      for(let d = new Date(s); d <= e; d.setDate(d.getDate()+1)){
        if(d.getMonth() === month && d.getFullYear() === year){
          const k = d.getDate();
          (events[k] = events[k] || []).push('Этап: ' + st.label);
        }
      }
    }catch(e){}
  });

  let html = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d => `<div class="cal-head">${d}</div>`).join('');
  for(let i=0;i<startDay;i++){
    const d = prevDays - startDay + i + 1;
    html += `<div class="cal-cell other"><div class="d">${d}</div></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const today = d === now.getDate();
    const evs = events[d] || [];
    html += `<div class="cal-cell ${today?'today':''}">
      <div class="d">${d}</div>
      ${evs.slice(0,3).map(e => `<div class="cal-event" title="${esc(e)}">${esc(e)}</div>`).join('')}
      ${evs.length>3?`<div class="muted" style="font-size:10px">+${evs.length-3}</div>`:''}
    </div>`;
  }
  const trailing = (7 - ((startDay + daysInMonth) % 7)) % 7;
  for(let i=1;i<=trailing;i++) html += `<div class="cal-cell other"><div class="d">${i}</div></div>`;
  box.innerHTML = `<div class="cal">${html}</div>
    <div class="muted" style="font-size:11px;margin-top:10px">${now.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</div>`;
}

function drawXray(box){
  if(!box) return;
  const rows = PROJECT_CARD_FIELDS.map(f => {
    const len = (state.project[f.key]||'').trim().length;
    const target = 120;
    const pct = Math.min(100, Math.round(len/target*100));
    const cls = pct < 30 ? 'xray-weak' : pct < 70 ? 'xray-mid' : 'xray-ok';
    return {f, len, pct, cls};
  });
  box.innerHTML = rows.map(r => `
    <div class="xray-row ${r.cls}">
      <div>
        <div style="display:flex;justify-content:space-between"><span>${esc(r.f.label)}</span><span class="muted" style="font-size:11px">${r.len} симв.</span></div>
        <div class="xray-bar"><div style="width:${r.pct}%"></div></div>
      </div>
      <div></div>
    </div>`).join('') +
    `<div class="muted" style="font-size:11.5px;margin-top:10px">Красные разделы — кандидаты на доработку перед защитой.</div>`;
}

function fmtPomo(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}
function togglePomo(){
  const btn = $('#pomoToggle');
  if(pomoRunning){ stopPomo(); if(btn) btn.textContent='Старт'; return; }
  pomoRunning = true;
  if(btn) btn.textContent='Пауза';
  pomoInterval = setInterval(() => {
    pomoSeconds--;
    const el = $('#pomoTime');
    if(el) el.textContent = fmtPomo(pomoSeconds);
    if(pomoSeconds <= 0){
      stopPomo();
      if(btn) btn.textContent='Старт';
      if(pomoMode === 'work'){
        state.pomo.sessions.push({ id:uid(), taskId: state.pomo.focusTaskId || null, minutes:25, ts: Date.now() });
        save();
      }
      toast(pomoMode==='work' ? 'Работа завершена — отдохни!' : 'Перерыв закончен — к работе!');
    }
  }, 1000);
}
function stopPomo(){
  pomoRunning = false;
  clearInterval(pomoInterval);
  pomoInterval = null;
}

let pitchInterval = null, pitchSeconds = 60, pitchRunning = false;
function renderPitch(main){
  const t = $('#pitchTime', main), h = $('#pitchHint', main);
  if(t) t.textContent = '1:00';
  if(h) h.textContent = 'Проблема';
  $('#pitchStart', main).onclick = () => {
    if(pitchRunning){ clearInterval(pitchInterval); pitchRunning = false; $('#pitchStart').textContent='Старт'; return; }
    pitchRunning = true; $('#pitchStart').textContent='Пауза';
    pitchInterval = setInterval(() => {
      pitchSeconds--;
      const mm = Math.floor(pitchSeconds/60), ss = pitchSeconds%60;
      if(t) t.textContent = `${mm}:${String(ss).padStart(2,'0')}`;
      if(h){
        if(pitchSeconds > 40) h.textContent = 'Проблема';
        else if(pitchSeconds > 20) h.textContent = 'Решение';
        else if(pitchSeconds > 5) h.textContent = 'Результат';
        else h.textContent = 'Финальная фраза';
      }
      if(pitchSeconds <= 0){
        clearInterval(pitchInterval); pitchRunning = false;
        $('#pitchStart').textContent='Старт';
        toast('Время!');
        pitchSeconds = 60;
        if(t) t.textContent = '1:00';
        if(h) h.textContent = 'Проблема';
      }
    }, 1000);
  };
  $('#pitchReset', main).onclick = () => {
    clearInterval(pitchInterval); pitchRunning = false;
    pitchSeconds = 60;
    if(t) t.textContent = '1:00';
    if(h) h.textContent = 'Проблема';
    $('#pitchStart').textContent='Старт';
  };
}

let defIdx = 0;
function buildSlides(){
  const p = state.project;
  const slides = [];
  slides.push({ h:'h1', title: p.name || 'Проект', sub: (state.team.map(m=>m.name).join(', ') || p.participants || '') });
  if(p.problem)    slides.push({ h:'h2', title:'Проблема', body:p.problem });
  if(p.relevance)  slides.push({ h:'h2', title:'Актуальность', body:p.relevance });
  if(p.goal)       slides.push({ h:'h2', title:'Цель', body:p.goal });
  if(p.tasks)      slides.push({ h:'h2', title:'Задачи', body:p.tasks });
  if(p.analogs)    slides.push({ h:'h2', title:'Аналоги', body:p.analogs });
  if(p.techSpecs)  slides.push({ h:'h2', title:'Технические характеристики', body:p.techSpecs });
  if(state.stages.length){
    slides.push({ h:'h2', title:'Этапы', list: state.stages.map(s => (s.done?'✓ ':'○ ') + s.label) });
  }
  if(p.economics)  slides.push({ h:'h2', title:'Экономика', body:p.economics });
  if(p.results)    slides.push({ h:'h2', title:'Результаты', body:p.results });
  if(p.stakeholders) slides.push({ h:'h2', title:'Заинтересованные стороны', body:p.stakeholders });
  slides.push({ h:'h1', title:'Спасибо!', sub: p.contacts || '' });
  return slides;
}

  state._slides = slides; defIdx = 0;

function defKey(e){
  if(e.key === 'Escape') closeDefense();
  else if(e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextDef(); }
  else if(e.key === 'ArrowLeft') { e.preventDefault(); prevDef(); }
}
function nextDef(){ if(defIdx < state._slides.length-1){ defIdx++; renderDefense(); } }
function prevDef(){ if(defIdx > 0){ defIdx--; renderDefense(); } }
function renderDefense(){
  const s = state._slides[defIdx];
  const slide = $('#defSlide');
  slide.innerHTML = s.h === 'h1'
    ? `<h1>${esc(s.title)}</h1>${s.sub?`<p>${esc(s.sub)}</p>`:''}`
    : `<h2>${esc(s.title)}</h2>
       ${s.body?`<p>${esc(s.body)}</p>`:''}
       ${s.list?`<ul>${s.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`;
  $('#defCounter').textContent = `${defIdx+1} / ${state._slides.length}`;
  $('#defLabel').textContent = state.project.name || 'VolVoxPro';
}
$('#defNext').onclick = nextDef;
$('#defPrev').onclick = prevDef;
$('#defExit').onclick = closeDefense;

function exportJSON(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  download(blob, `volvoxpro-${Date.now()}.json`);
  state._lastBackup = Date.now(); save();
  toast('JSON сохранён');
}

function importJSON(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!confirm('Заменить текущие данные?')) return;
      state = migrate(data);
      save(); renderNav(); renderMain();
      toast('Загружено');
    }catch(err){ toast('Некорректный файл', true); }
  };
  r.readAsText(file);
}

function mergeJSON(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const other = migrate(JSON.parse(ev.target.result));
      snapshot();
      PROJECT_CARD_FIELDS.forEach(f => {
        if(!(state.project[f.key]||'').trim() && (other.project[f.key]||'').trim()){
          state.project[f.key] = other.project[f.key];
        }
      });
      ['team','journal','resources','brainstorm','reflection','gantt','stages'].forEach(k => {
        const map = new Map(state[k].map(x => [x.id, x]));
        (other[k]||[]).forEach(x => { if(!map.has(x.id)) map.set(x.id, x); });
        state[k] = [...map.values()];
      });
      ['todo','doing','done'].forEach(col => {
        const map = new Map(state.kanban[col].map(x => [x.id, x]));
        (other.kanban[col]||[]).forEach(x => { if(!map.has(x.id)) map.set(x.id, x); });
        state.kanban[col] = [...map.values()];
      });
      Object.assign(state.mentorComments, other.mentorComments || {});
      save(); renderNav(); renderMain();
      toast('Слияние завершено');
    }catch(err){ toast('Ошибка слияния: '+err.message, true); }
  };
  r.readAsText(file);
}

function importMentor(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.mentorComments){ return toast('Нет комментариев в файле', true); }
      snapshot();
      Object.assign(state.mentorComments, data.mentorComments);
      save(); renderNav(); renderMain();
      toast('Комментарии ментора загружены');
    }catch(err){ toast('Ошибка', true); }
  };
  r.readAsText(file);
}

function exportXLSX(){
  if(typeof XLSX === 'undefined') return toast('XLSX библиотека не загрузилась', true);
  const p = state.project;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Раздел','Значение'], ...PROJECT_CARD_FIELDS.map(f => [f.label, p[f.key]||''])]), 'Карта');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Этап','Начало','Конец','Задачи','Результат','Готов'],
    ...state.stages.map(s => [s.label, s.start||'', s.end||'', (s.tasks||[]).map(t=>t.text).join('; '), s.result||'', s.done?'✓':''])]), 'Этапы');
  const taskRows = [['Колонка','Задача','Исполнитель']];
  ['todo','doing','done'].forEach(k => {
    const label = {todo:'Надо сделать', doing:'В работе', done:'Готово'}[k];
    state.kanban[k].forEach(t => {
      const m = state.team.find(x => x.id === t.assignee);
      taskRows.push([label, t.text, m?.name || '']);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(taskRows), 'Задачи');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['ФИО','Организация','Класс','Контакты','Роль'],
    ...state.team.map(m => [m.name, m.organization||'', m.klass||'', m.contacts||'', m.role||''])]), 'Команда');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Дата','Заголовок','Описание'], ...state.journal.map(j => [j.date, j.title, j.text])]), 'Журнал');

  toast('Excel сохранён');
}

  state.stages.forEach((s,i) => {

    if(s.start || s.end) md += `_Срок: ${s.start||'?'} — ${s.end||'?'}_\n\n`;
    (s.tasks||[]).forEach((t,j) => md += `- Задача ${i+1}.${j+1}. ${t.text}\n`);

    md += `## Журнал\n\n`;

  download(new Blob([md], {type:'text/markdown'}), `volvoxpro-${Date.now()}.md`);

}

}

/* ============================================================
   ТЕМА / МЕНТОР / ГОРЯЧИЕ КЛАВИШИ
   ============================================================ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme || 'dark');
}
$('#themeBtn').onclick = () => {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  save(); applyTheme();
};

$('#mentorBtn').onclick = () => {
  if(state.mentorMode){
    state.mentorMode = false;
    sessionStorage.removeItem(MENTOR_AUTH_KEY);
    save(); renderMain();
    toast('Менторский режим выключен');
    return;
  }
  const authed = sessionStorage.getItem(MENTOR_AUTH_KEY) === '1';
  if(authed){
    state.mentorMode = true;
    save(); renderMain();
    toast('Менторский режим включён');
    return;
  }
  const pass = prompt('Введите пароль ментора:');
  if(pass === null) return;
  if(pass === MENTOR_PASSWORD){
    sessionStorage.setItem(MENTOR_AUTH_KEY, '1');
    state.mentorMode = true;
    save(); renderMain();
    toast('Менторский режим включён');
  } else {
    toast('Неверный пароль', true);
  }
};

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const inField = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  if(e.ctrlKey && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === 'z' && !inField){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === 'e'){ e.preventDefault(); exportJSON(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === 's'){ e.preventDefault(); doSave(); toast('Сохранено'); return; }
  if(e.ctrlKey && e.key.toLowerCase() === 'd'){ e.preventDefault(); exportProjectCard(); return; }
  if(e.key === 'Escape'){ closeSearch(); }
  if(inField) return;
  const map = {'1':'ideas','2':'materials','3':'project','4':'analytics','5':'board','6':'tools','7':'export'};
  if(map[e.key]){ state.section = map[e.key]; save(); renderNav(); renderMain(); }
});

let lastSnap = Date.now();
setInterval(() => {
  if(Date.now() - lastSnap > 10*60*1000){
    takeHistorySnapshot('авто');
    lastSnap = Date.now();
  }
}, 60*1000);

setInterval(() => {
  if(!state._autobackup) return;
  const last = state._lastBackup || 0;
  if(Date.now() - last > 24*60*60*1000){
    toast('Пора сделать резервную копию JSON', true);
  }
}, 60*60*1000);

/* ============================================================
   СТАРТ
   ============================================================ */
if(state.mentorMode && sessionStorage.getItem(MENTOR_AUTH_KEY) !== '1'){
  state.mentorMode = false;
  save();
}

applyTheme();
renderNav();
renderMain();
if(!state.onboarded && !Object.keys(state.project).length){
  setTimeout(openWizard, 400);
}
</script>
<script src="github-upload.js"></script>
</body>
</html>
